<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Academic Hub{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0F172A',
                        cardbg: '#1E293B',
                        borderbg: '#334155'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-cardbg border-b border-borderbg py-3 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-xl font-bold text-blue-400 flex items-center gap-2">
                🎓 <span>Academic Hub</span>
            </a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="{% url 'dashboard' %}" class="hover:text-blue-400 transition">Dashboard</a>
                <a href="{% url 'weekend_planner' %}" class="hover:text-amber-400 transition flex items-center gap-1">
                    ⚡ <span>Weekend Planner</span>
                </a>
                <a href="{% url 'projects_list' %}" class="hover:text-blue-400 transition">Proiecte</a>
                <a href="{% url 'debug_log_list' %}" class="hover:text-blue-400 transition">Debug Vault</a>
                <a href="/admin/" target="_blank" class="text-slate-400 hover:text-white transition">Admin ⚙️</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto w-full p-6 flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-borderbg py-4 text-center text-xs text-slate-500">
        Academic Hub — Calculatoare & TI | Anul 3
    </footer>

</body>
</html>
